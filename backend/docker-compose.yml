# =============================================================================
# Roomies Backend — Docker Compose
# =============================================================================
# Spins up PostgreSQL, Redis, and the backend app.
# Usage:
#   docker compose up -d          (start all services)
#   docker compose up -d postgres redis   (just the databases)
#   docker compose logs -f app    (tail app logs)
#   docker compose down -v        (stop + remove volumes)
# =============================================================================

services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    container_name: roomies-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: roomies
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roomies"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Redis (for BullMQ) ----------
  redis:
    image: redis:7-alpine
    container_name: roomies-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Backend App ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: roomies-backend
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env.docker
    volumes:
      # Mount source for hot-reload in development
      - ./src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
