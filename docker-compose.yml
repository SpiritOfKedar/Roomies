# =============================================================================
# Roomies — Full-Stack Docker Compose
# =============================================================================
# Orchestrates PostgreSQL, Redis, Backend (Express), and Frontend (Next.js).
#
# Usage:
#   docker compose up --build -d       (build & start all services)
#   docker compose logs -f             (tail all logs)
#   docker compose down -v             (stop & remove volumes)
#
# Ports:
#   Frontend  → http://localhost:3000
#   Backend   → http://localhost:3001
#   Postgres  → localhost:5434
#   Redis     → localhost:6381
# =============================================================================

services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    container_name: roomies-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: roomies
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roomies"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Redis (for BullMQ) ----------
  redis:
    image: redis:7-alpine
    container_name: roomies-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Backend (Express + Prisma) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: roomies-backend
    restart: unless-stopped
    ports:
      - "3005:3000"
    env_file:
      - ./backend/.env.docker
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- Frontend (Next.js) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: roomies-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3005
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.js:/app/next.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
